apiVersion: kafka.strimzi.io/v1
kind: KafkaBridge
metadata:
  name: my-bridge
spec:
  image: quay.io/ppatierno/kafka-bridge:java25
  replicas: 1
  bootstrapServers: my-cluster-kafka-bootstrap:9093
  http:
    port: 8443
    tls:
      certificateAndKey:
        secretName: my-bridge-cert-secret
        certificate: cert.crt
        key: key.key
  tls:
    trustedCertificates:
      - secretName: my-cluster-cluster-ca-cert
        certificate: ca.crt
  jvmOptions:
    javaSystemProperties:
      - name: javax.net.debug
        value: "ssl:handshake"
---
apiVersion: v1
kind: Secret
metadata:
  name: my-bridge-cert-secret
type: Opaque
data:
  cert.crt: 
  key.key: 